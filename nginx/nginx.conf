server{
    listen 80;
    server_name sandbox.crowdflow.my.id;

    # Docker's embedded DNS - re-resolve container names at request time
    # instead of caching the IP once at nginx startup (a static `upstream{}`
    # block resolves once and goes stale if frontend/backend ever restart
    # with a new IP, which is why `docker compose restart nginx` used to be
    # needed). valid=10s keeps this cheap without permanently caching.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream/; #MUST include trailing slash
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
# Sends "Connection: upgrade" only for genuine WebSocket requests and
# "Connection: close" for everything else. The previous literal 'upgrade' was
# sent on EVERY request, which defeats upstream keep-alive.
#
# Must sit at the top level of this file, not inside server{} — this file is
# included from nginx.conf's http{} block, and `map` is only valid there.
# Each nginx INSTANCE needs its own copy: defining this on the VPS edge does
# nothing for this container.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server{
    listen 80;
    # Not a hostname: this container serves exactly one site and the VPS edge
    # routes by host. Hardcoding sandbox.crowdflow.my.id meant the production
    # container (which receives Host: crowdflow.my.id) matched nothing and only
    # worked by falling back to the default server — which would silently break
    # the moment a second server block was added here.
    server_name _;

    # Docker's embedded DNS - re-resolve container names at request time
    # instead of caching the IP once at nginx startup (a static `upstream{}`
    # block resolves once and goes stale if frontend/backend ever restart
    # with a new IP, which is why `docker compose restart nginx` used to be
    # needed). valid=10s keeps this cheap without permanently caching.
    resolver 127.0.0.11 valid=10s;

    # The VPS edge nginx proxies to a loopback-published port on the host, so
    # Docker rewrites the peer address to this bridge's gateway (172.x.0.1) —
    # NOT 127.0.0.1. Without these three lines $proxy_add_x_forwarded_for
    # appends that gateway, and since middleware/ratelimit.go's clientIP()
    # trusts the LAST X-Forwarded-For entry, every request in the world would
    # resolve to one address. That collapses the login limiter (10 per 15 min)
    # into a single platform-wide bucket.
    #
    # Trusting the header is safe here because docker-compose binds this port
    # to 127.0.0.1, so the edge is the only thing that can reach it. Keep the
    # trusted range private and narrow: with real_ip_recursive on, a wide
    # set_real_ip_from would let clients forge their own IP and skip the limit.
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location / {
        set $frontend_upstream frontend:3000;
        # $request_uri (the original, unmodified URI) is passed explicitly
        # because proxy_pass loses its automatic location-prefix-replacement
        # once the target contains a variable - without this, requests like
        # /_next/static/chunks/x.css silently collapsed to "/" and Next
        # served the HTML fallback (200 OK, wrong content-type) instead of
        # the actual asset.
        proxy_pass http://$frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        # nginx defaults to 1m, which silently 413'd every event document and
        # cover image over 1MB with an HTML error page — before the request
        # reached Go, so the handler's own limits and JSON error responses
        # never ran. 12m matches the MaxBytesReader in the upload handlers
        # (10MB file + multipart framing headroom); the service still enforces
        # the real 10MB cap and returns a proper 422.
        #
        # Scoped to /api/ deliberately: uploads only go here, so the frontend
        # location keeps the cheap 1m default.
        client_max_body_size 12m;

        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
services:
  minio:
    image: minio/minio:latest
    container_name: crowdflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminpassword
    command: server /data --console-address ":9001"
    networks:
      - crowdflow-net

  minio-init:
    image: minio/mc:latest
    container_name: crowdflow-minio-init
    depends_on:
      - minio
    networks:
      - crowdflow-net
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadminpassword; do echo 'Waiting for MinIO...'; sleep 1; done;
      if ! /usr/bin/mc ls localminio/crowdflow-uploads > /dev/null 2>&1; then
        /usr/bin/mc mb localminio/crowdflow-uploads;
        /usr/bin/mc anonymous set public localminio/crowdflow-uploads;
        echo 'Bucket crowdflow-uploads created successfully';
      else
        echo 'Bucket crowdflow-uploads already exists';
      fi;
      "

networks:
  crowdflow-net:
    name: crowdflow_crowdflow-net
    external: true

volumes:
  minio-data:
    driver: local

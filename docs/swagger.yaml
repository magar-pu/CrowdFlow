        delegate_name:
          type: string
          example: Sam Co-Organizer
        delegate_email:
          type: string
          example: sam@example.com
        scope:
          type: string
          enum: [all, specific]
          description: '`all` covers the owner''s whole portfolio incl. future events; `specific` covers only the listed events.'
          example: specific
        status:
          type: string
          enum: [pending, active, declined, revoked]
          example: active
        requested_by:
          type: integer
          description: The user who initiated the delegation (owner, delegate, or admin).
          example: 12
        approved_by:
          type: integer
          nullable: true
          description: The owner who approved the delegation; null until approved.
          example: 12
        note:
          type: string
          nullable: true
          example: Helping run the summer festival series.
        events:
          type: array
          description: Covered events (populated only for `scope=specific`).
          items:
            $ref: '#/components/schemas/DelegationEvent'
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    DelegationEvent:
      type: object
      properties:
        event_id:
          type: integer
          example: 42
        name:
          type: string
          example: Summer Music Festival

    Layout:
      type: object
      description: A saved seat-map plan for a venue. Returned as a summary by the list endpoint and embedded in LayoutDetail on load.
      properties:
        id:
          type: integer
          example: 12
        venue_id:
          type: integer
          example: 1
        name:
          type: string
          example: Main Floor Plan
        schema_version:
          type: integer
          description: Geometry schema version, for forward-compatible migrations.
          example: 1
        geometry:
          type: object
          nullable: true
          description: Opaque JSONB document holding decorative geometry (stage, facilities, blueprint ref, section shapes). Structure is not fixed by this API.
        visibility:
          type: string
          enum: [public, event_exclusive]
          example: public
        owner_user_id:
          type: integer
          nullable: true
          description: The user who owns an event-exclusive layout; null for public layouts.
          example: null
        status:
          type: string
          enum: [draft, published, archived]
          example: draft
        created_at:
          type: string
          format: date-time
          example: '2026-07-20T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-20T10:00:00Z'


    LayoutSeat:
      type: object
      description: One physical seat's identity, position and optional section tag. The integer id is the canonical identity referenced by orders, tickets and the scanner.
      properties:
        id:
          type: integer
          example: 501
        section_id:
          type: integer
          nullable: true
          example: 4
        row:
          type: string
          description: Display label only.
          example: A
        number:
          type: string
          description: Display label only.
          example: "12"
        pos_x:
          type: number
          format: double
          nullable: true
          example: 120.5
        pos_y:
          type: number
          format: double
          nullable: true
          example: 88.0

    LayoutDetail:
      type: object
      description: The full read shape returned when loading a layout - the Layout header plus every section and seat belonging to it.
      allOf:
        - $ref: '#/components/schemas/Layout'
        - type: object
          properties:
            seats:
              type: array
              items:
                $ref: '#/components/schemas/LayoutSeat'

    CreateLayoutRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Main Floor Plan
        visibility:
          type: string
          enum: [public, event_exclusive]
          description: Defaults to `public` when omitted.
          example: public


    SeatInput:
      type: object
      description: One seat in a save payload. `section_key` references a SectionInput in the SAME payload (real or temp), or is null for a section-free seat.
      required:
        - key
        - row
        - number
      properties:
        key:
          type: string
          example: seat-tmp-1
        id:
          type: integer
          nullable: true
          description: Real DB id for an existing seat; null to insert a new one.
          example: null
        row:
          type: string
          example: A
        number:
          type: string
          example: "12"
        pos_x:
          type: number
          format: double
          nullable: true
          example: 120.5
        pos_y:
          type: number
          format: double
          nullable: true
          example: 88.0

    SaveLayoutRequest:
      type: object
      description: The whole editor state in one document. Seats and sections diff against what is stored (insert/update/delete).
      required:
        - name
        - expected_updated_at
      properties:
        name:
          type: string
          example: Main Floor Plan
        visibility:
          type: string
          enum: [public, event_exclusive]
          example: public
        geometry:
          type: object
          nullable: true
          description: Opaque JSONB document holding decorative geometry.
        expected_updated_at:
          type: string
          format: date-time
          description: The `updated_at` value the client loaded. The save is rejected with 409 (`STALE_LAYOUT`) if the layout changed since (optimistic locking).
          example: '2026-07-20T10:00:00Z'
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatInput'

    SaveLayoutResponse:
      type: object
      description: The persisted layout plus the maps the client uses to reconcile its temporary keys to real DB ids. Only newly-inserted rows appear in the maps.
      properties:
        layout:
          $ref: '#/components/schemas/LayoutDetail'
        seat_id_map:
          type: object
          additionalProperties:
            type: integer
          description: Client seat key -> new DB id, for inserted seats only.
          example:
            seat-tmp-1: 501

    BankVerificationItem:
      type: object
      description: One row of the auditor bank-verification queue. Sourced entirely from organizer_applications, the single source of payout bank details. Fields use camelCase to mirror the auditor console types.
      properties:
        applicationId:
          type: integer
          description: organizer_applications row id. Pass as {id} to POST /auditor/organizers/{id}/verify-bank.
          example: 42
        organizerId:
          type: integer
          description: The organizer's user id.
          example: 17
        organizerName:
          type: string
          example: Richie Obhasa
        businessName:
          type: string
          example: Symphony Events Co.
        businessEmail:
          type: string
          example: richie@symphonyevents.example
        applicationStatus:
          type: string
          example: approved
        bankName:
          type: string
          example: Bank Central Asia
        bankAccountNumber:
          type: string
          example: "1234567890"
        bankAccountHolder:
          type: string
          example: Richie Obhasa
        verificationStatus:
          type: string
          description: Raw bank_verification_status column value.
          enum: [unverified, verified]
          example: verified
        detailsChanged:
          type: boolean
          description: True when a verified account's bank details were edited after the last verification - the third state verificationStatus alone cannot express.
          example: false
        bankDetailsUpdatedAt:
          type: string
          description: Empty string when never set.
          example: "2026-07-20 10:00"
        verifiedBy:
          type: string
          description: Verifying auditor's name. Empty for accounts never verified, or grandfathered as verified by migration 0022 (verified by nobody, so no actor is fabricated).
          example: Dian Auditor
        verifiedAt:
          type: string
          description: Empty string when never verified.
          example: "2026-07-21 09:15"
        pendingPayouts:
          type: integer
          description: Count of this organizer's payouts currently in `pending` status, blocked on this account's verification.
          example: 1

  /api/v1/admin/users/{id}/roles:
    post:
      summary: Admin - Grant User Role
      description: |
        Grants a role to a user: platform-wide when `event_id` is omitted/null (e.g. Event Organizer
        everywhere), or scoped to one event when `event_id` is set (e.g. Auditor on event 42).
        Only verified users may be granted a role; duplicate grants are rejected. The grant is
        recorded in the admin activity log. Requires the Super Admin platform role.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the target user.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRoleRequest'
      responses:
        '201':
          description: Role granted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Role granted
        '400':
          description: User ID not an integer or invalid JSON body (`INVALID_ID`, `BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid, or the authenticated admin could not be resolved (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Grant failed - user not found, user not verified, or user already has this role assignment (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Admin - Revoke User Role
      description: |
        Revokes a role from a user, matching the same event scope the grant used: `event_id`
        omitted/null revokes the platform-wide grant, `event_id` set revokes that event's scoped
        grant. Refuses to revoke Super Admin from yourself, and refuses to revoke the platform's
        last remaining Super Admin (both would leave the console with no way back in). The
        revocation is recorded in the admin activity log. Requires the Super Admin platform role.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the target user.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRoleRequest'
      responses:
        '200':
          description: Role revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Role revoked
        '400':
          description: User ID not an integer or invalid JSON body (`INVALID_ID`, `BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid, or the authenticated admin could not be resolved (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Revoke failed (`VALIDATION_FAILED`) - the role id does not exist, the user does not
            have that role/event-scope assignment, the caller tried to revoke their own Super Admin
            role, or this is the platform's last Super Admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


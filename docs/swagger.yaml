  /api/v1/scanner/checkin/{eventId}:
    post:
      summary: Scanner - Check In Ticket
      description: |
        Validates a scanned QR payload and checks in the ticket if valid. Requires a ticketman
        session scoped to this exact event (`{eventId}` must match the session's own event).

        Always returns 200 for a decided outcome (`VALID`, `ALREADY_USED`, `WRONG_TIER`, ...) in
        the response body's `status` field - 401/403 are reserved for auth failures, per the
        frozen scan contract.

        Rate limited per client IP: at most 120 scans per minute (fixed-window counter in Redis;
        fails open on Redis outage).
      security:
        - TicketmanCookieAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qr_payload:
                  type: string
                gate_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Scan decided (see `status` in the response body for the outcome).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CheckInResponse'
        '400':
          description: Invalid request body (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ticketman session missing/invalid (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `{eventId}` does not match the session's own event (`FORBIDDEN`), or the scan requires
            a gate assignment the staff account does not hold (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 120 scans from this IP within 1 minute (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Check-in processing failed (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/scanner/checkin/{eventId}/reject:
    post:
      summary: Scanner - Manual Reject
      description: |
        Records a manual rejection of a scan (mitigation M1) - e.g. a staff override for a ticket
        that superficially validated but should not be admitted. Requires a ticketman session
        scoped to this exact event.

        Rate limited per client IP: at most 120 requests per minute.
      security:
        - TicketmanCookieAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket_id:
                  type: string
                reason:
                  type: string
                note:
                  type: string
      responses:
        '200':
          description: Rejection recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Rejection recorded
        '400':
          description: Invalid request body, or the rejection could not be recorded (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ticketman session missing/invalid (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The eventId path parameter does not match the session's own event (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 120 requests from this IP within 1 minute (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


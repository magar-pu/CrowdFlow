        '403':
          description: Not the event's organizer (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            One precondition for submission is unmet: no venue bound (`VENUE_REQUIRED`), seating incomplete
            (`SEATING_INCOMPLETE`), event documents incomplete (`DOCUMENTS_INCOMPLETE`), no payout details on
            file (`PAYOUT_DETAILS_REQUIRED`), or account-level organizer documents incomplete

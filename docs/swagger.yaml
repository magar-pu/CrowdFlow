        '200':
          description: Verification rejected.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Verification rejected
        '400':
          description: Applicant ID must be a valid integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid, or the authenticated admin could not be resolved (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Status update failed - e.g. user not found (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/{id}/delegations:
    get:
      summary: Admin - List User Co-Organizer Delegations
      description: |
        Read-only Super Admin oversight of a user's co-organizer delegations: those the user granted
        as an event owner (`owned`) and those delegated to the user as a co-organizer (`received`).
        Delegations are created from the organizer console, not here. Requires the Super Admin platform role.
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the target user.
          schema:
            type: integer
      responses:
        '200':
          description: The user's delegations, both directions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          owned:
                            type: array
                            items:
                              $ref: '#/components/schemas/Delegation'
                          received:
                            type: array
                            items:
                              $ref: '#/components/schemas/Delegation'
        '400':
          description: User ID not an integer (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to list delegations (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/delegations/{id}:
    delete:
      summary: Admin - Revoke Co-Organizer Delegation
      description: |
        Moderation revoke of any co-organizer delegation, regardless of ownership. Sets the delegation
        status to `revoked` and notifies both the owner and the delegate. Requires the Super Admin platform role.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the delegation.
          schema:
            type: integer
      responses:
        '200':
          description: Delegation revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked:
                            type: boolean
                            example: true
        '400':
          description: Delegation ID must be an integer (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Delegation not found (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Delegation is already declined/revoked and cannot be revoked (`INVALID_STATE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to revoke delegation (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auditor/bank-verifications:
    get:
      summary: Auditor - List Organizer Bank Verification Queue
      description: |
        Organizer payout bank accounts awaiting or already given verification, sourced entirely
        from `organizer_applications` (the single source of payout bank details). Only applications
        with a bank account number on file are listed. Ordered accounts changed since their last
        verification first, then unverified accounts, then by staleness of the last change. Requires
        the Auditor or Super Admin platform role.
      security:
        - CookieAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by queue state. Omit or empty for all.
          schema:
            type: string
            enum: [unverified, verified, changed]
        - name: search
          in: query
          required: false
          description: Case-insensitive match against business name, organizer name, or bank account number.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-indexed page number. Defaults to 1 when absent or not positive.
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 when absent or not positive.
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Bank verification queue retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BankVerificationItem'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed - Auditor or Super Admin required (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Unknown `status` filter value - must be one of `unverified`, `verified`, `changed`, or omitted (`VALIDATION_FAILED`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load the bank verification queue (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auditor/organizers/{id}/verify-bank:
    post:
      summary: Auditor - Verify Organizer Payout Bank Account
      description: |
        Marks the organizer's payout bank account as verified. `id` is the `organizer_applications`
        row id - the same id every other `/auditor/organizers/*` route takes, and the one the payout
        detail response carries as `applicationId` (NOT a payout id: this used to be scoped to a
        payout, which left organizers who had never requested a payout with no way to have their
        account verified).

        `accountNumber` must match the account number currently on file, digit-for-digit; a mismatch
        is refused rather than silently verifying whatever the organizer has since changed it to.
        One-way: only an organizer edit resets the account back to `unverified`.
        Requires the Auditor or Super Admin platform role.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The organizer_applications row id.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountNumber]
              properties:
                accountNumber:
                  type: string
                  description: The account number as currently displayed to the auditor; compared against the value on file.
                  example: "1234567890"
      responses:
        '200':
          description: Bank account verified.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Bank account verified
        '400':
          description: Organizer application ID must be a positive integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed - Auditor or Super Admin required (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No organizer application with that ID (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No bank account on file, or the submitted account number does not match what is on file (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/organizer/apply:
    post:
      summary: Submit Organizer Application
      description: |
        Submits a new organizer onboarding application (multipart form: business fields plus up to five
        documents keyed `ktp`, `npwp`, `nib`, `siup`, `business_license`). Requires a Turnstile CAPTCHA
        token (`turnstile_token`). Authenticated (any signed-in user), NOT gated behind the verified-organizer role.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                business_name: { type: string }
                business_type: { type: string }
                business_email: { type: string }
                business_phone: { type: string }
                website: { type: string }
                description: { type: string }
                bank_name: { type: string }
                bank_account_holder: { type: string }
                bank_account_number: { type: string }
                business_address: { type: string }
                turnstile_token: { type: string }
                ktp: { type: string, format: binary }
                npwp: { type: string, format: binary }
                nib: { type: string, format: binary }
                siup: { type: string, format: binary }
                business_license: { type: string, format: binary }
      responses:
        '201':
          description: Application created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
        '400':
          description: Upload too large/malformed (`BAD_REQUEST`), invalid CAPTCHA (`INVALID_TURNSTILE`), or an unreadable per-field file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication missing (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An application already exists for this user (`APPLICATION_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Application validation failed (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to submit application (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/organizer/application:
    get:

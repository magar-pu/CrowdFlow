        '422':
          description: Validation failed (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to update application (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:

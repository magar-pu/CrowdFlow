      description: |
        Mints a short-lived signed link for one document attached to an event review. `source`
        disambiguates which table `docId` belongs to and defaults to `organizer` (account-level
        document) when omitted, matching every pre-existing caller. Response is sent with
        `Cache-Control: no-store` since it carries a live credential. Requires the Auditor or Super
        Admin platform role.
      security:
        - CookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: docId, in: path, required: true, schema: { type: integer } }
        - name: source
          in: query
          required: false
          description: Which document table `docId` belongs to. Defaults to `organizer`.
          schema:
            type: string
            enum: [organizer, event]
      responses:
        '200':
          description: Signed view URL minted.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Signed URL payload.
        '400':
          description: Document ID must be a positive integer (`INVALID_ID`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).

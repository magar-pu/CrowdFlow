  /api/organizer/documents:
    get:
      summary: List Account Documents
      description: Lists the caller's account-level onboarding documents (KTP/NPWP/NIB/SIUP/business license).
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Documents retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
        '401':
          description: Authentication missing (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load documents (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Upload Account Document
      description: |
        Uploads one account-level document (multipart: `document_type`, `file`). Authenticated but NOT
        gated behind the verified-organizer role, since a rejected applicant re-files here.

        Rate limited per client IP: at most 30 uploads per hour, shared with the per-event document
        upload route (fixed-window counter in Redis; fails open on Redis outage).
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document_type, file]
              properties:
                document_type: { type: string }
                file: { type: string, format: binary }
      responses:
        '200':
          description: Document uploaded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
        '400':
          description: Upload too large/malformed (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication missing (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No organizer application on file yet (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing `document_type` or `file`, or document validation failed (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 30 uploads from this IP within an hour (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to upload the document (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


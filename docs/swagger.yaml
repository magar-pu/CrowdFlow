        '401':
          description: Authentication missing (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No application to delete (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Application already reviewed/locked (`APPLICATION_LOCKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ticketman/auth/login:
    post:
      summary: Ticketman - Login
      description: |
        Logs in a ticketman (scanner staff) account for one event, using an event code plus
        credentials. Sets the `ticketman_access_token` session cookie - a completely separate
        session system from platform login, signed with its own secret. Turnstile-protected.

        Rate limited per client IP: at most 10 attempts per 15-minute window (fixed-window counter
        in Redis; fails open on Redis outage) - same ceiling as the platform login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, eventCode]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                eventCode:
                  type: string
                turnstileToken:
                  type: string
      responses:
        '200':
          description: Login successful. Sets the `ticketman_access_token` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TicketmanSessionInfo'
        '400':
          description: Invalid request body (`BAD_REQUEST`), or CAPTCHA verification failed (`INVALID_TURNSTILE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials or event code (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 10 attempts from this IP within 15 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ticketman/auth/logout:
    post:

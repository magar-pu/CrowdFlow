openapi: 3.0.3
info:
  title: CrowdFlow Event Ticketing API
  description: |
    API documentation for the CrowdFlow Venue and Event Management platform.

    ### Security Architecture:
    - **Session Authentication**: A short-lived JWT access token is set as a secure `HttpOnly` cookie named `access_token` (Path `/`). It is paired with a long-lived, rotating, server-revocable `refresh_token` cookie (scoped to Path `/api/v1/auth`) which `POST /api/v1/auth/refresh` exchanges for a fresh access token once the access token expires.
    - **CSRF Protection**: State-changing endpoints require Double-Submit Cookie verification. The client extracts the value of the `csrf_token` cookie and submits it in the custom header `X-CSRF-Token`. Only `/api/v1/auth/login` and `/api/v1/auth/register` are exempt.
    - **Admin Console**: Every `/api/v1/admin/*` route requires the `Super Admin` platform role.

    All responses (success and error) are wrapped in a standard JSON response envelope.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development Server
  - url: /
    description: Proxy Gateway (Nginx)

paths:
  /api/health:
    get:
      summary: Health Check
      description: Verifies database connectivity and application status.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          message:
                            type: string
                            example: CrowdFlow API is running
        '500':
          description: Database or server connectivity error (`DATABASE_UNREACHABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: User Registration
      description: Registers a new user native credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: User registered successfully
        '400':
          description: Invalid request body (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed - missing required fields (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - email already exists (`EMAIL_ALREADY_REGISTERED`) or other registration failure (`REGISTRATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 10 registrations from this IP within 1 hour (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: User Login
      description: |
        Native credentials login. Generates access session cookies.

        Rate limited per client IP: at most 10 attempts per 15-minute window
        (fixed-window counter in Redis; fails open on Redis outage).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication. Sets `access_token`, `refresh_token`, and `csrf_token` cookies. No token is returned in the JSON body.
          headers:
            Set-Cookie:
              description: |
                Sets three cookies:
                1. `access_token`: Short-lived HttpOnly JWT access token (Path `/`).
                2. `refresh_token`: Long-lived HttpOnly rotating refresh token (Path `/api/v1/auth`).
                3. `csrf_token`: Client-readable cookie for CSRF double-submission (Path `/`).
              schema:
                type: string
                example: access_token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            type: string
                            example: "12"
                          email:
                            type: string
                            format: email
                            example: admin@crowdflow.com
                          full_name:
                            type: string
                            example: Richie Obhasa
                          role:
                            type: string
                            description: Highest-privilege platform-wide role held by the user.
                            enum: [User, Event Organizer, Super Admin]
                            example: Super Admin
        '400':
          description: Invalid JSON body (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid credentials (`AUTHENTICATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 10 login attempts from this IP within 15 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Refresh Session
      description: |
        Rotates the refresh token and issues a new access token. Authenticated
        purely via the `refresh_token` cookie (the `access_token` may be expired,
        so `CookieAuth` is deliberately NOT required here). CSRF-protected like any
        state-changing POST.

        On success the refresh token is rotated and all three auth cookies
        (`access_token`, `refresh_token`, `csrf_token`) are re-set. On any failure â€”
        missing, expired, revoked, or replayed (reuse-detected) token â€” all auth
        cookies are cleared and 401 is returned so the client falls back to a full
        login.

        Rate limited per client IP: at most 60 attempts per 15-minute window
        (fixed-window counter in Redis; fails open on Redis outage).
      security:
        - RefreshCookie: []
        - CSRFToken: []
      responses:
        '200':
          description: Session refreshed. Rotates and re-sets the `access_token`, `refresh_token`, and `csrf_token` cookies.
          headers:
            Set-Cookie:
              description: Re-sets all three auth cookies with a freshly minted access token and rotated refresh token.
              schema:
                type: string
                example: access_token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            type: string
                            example: "12"
                          email:
                            type: string
                            format: email
                            example: admin@crowdflow.com
                          full_name:
                            type: string
                            example: Richie Obhasa
                          role:
                            type: string
                            description: Highest-privilege platform-wide role held by the user.
                            enum: [User, Event Organizer, Super Admin]
                            example: Super Admin
        '401':
          description: Refresh token missing, expired, revoked, or replayed (`UNAUTHORIZED`). All auth cookies are cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF verification missing or failed (`CSRF_TOKEN_MISSING`, `CSRF_HEADER_MISSING`, `CSRF_TOKEN_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 60 refresh attempts from this IP within 15 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/google/login:
    get:
      summary: Google OAuth Redirect
      description: Initiates Google OAuth2 authorization code flow by redirecting the browser.
      responses:
        '307':
          description: Temporary redirect to Google's consent screen. Sets `oauth_state` cookie (5 minute expiry).
          headers:
            Location:
              description: Google Authorization URL.
              schema:
                type: string
                example: https://accounts.google.com/o/oauth2/v2/auth?...
            Set-Cookie:
              description: Sets `oauth_state` HttpOnly cookie for CSRF state validation.
              schema:
                type: string

  /api/v1/auth/google/callback:
    get:
      summary: Google OAuth Callback
      description: Processes Google authorization code, verifies state, provisions user, and redirects the browser based on the user's platform role.
      parameters:
        - name: state
          in: query
          required: true
          description: OAuth state verification token matching the `oauth_state` cookie.
          schema:
            type: string
        - name: code
          in: query
          required: true
          description: Authorization code returned from Google.
          schema:
            type: string
      security:
        - StateCookie: []
      responses:
        '307':
          description: |
            Redirect outcome. On successful login the `oauth_state` cookie is cleared, the `access_token`,
            `refresh_token`, and `csrf_token` session cookies are set, and the browser is redirected by platform role:
            - `Super Admin` â†’ `/admin`
            - `Auditor` â†’ `/auditor`
            - `Event Organizer` â†’ `/dashboard`
            - everyone else â†’ `/`

            If the email is already registered with native credentials, no session is created and the browser
            is redirected to `/login?error=PROVIDER_MISMATCH&provider=native`.
          headers:
            Location:
              schema:
                type: string
                example: /dashboard
        '400':
          description: State verification cookie missing or auth code missing (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: State token verification mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication code exchange failed (`AUTHENTICATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User Logout
      description: |
        Logs out the current session. Revokes the server-side refresh session (using the
        `refresh_token` cookie) so the refresh token can no longer be used, then clears all
        three auth cookies (`access_token`, `refresh_token`, `csrf_token`). Does not require an
        authenticated access token, but does require CSRF verification (double-submit cookie).
        Logout still succeeds even if server-side revocation fails.
      security:
        - CSRFToken: []
      responses:
        '200':
          description: Successfully logged out. Revokes the server-side refresh session and clears the `access_token`, `refresh_token`, and `csrf_token` cookies.
          headers:
            Set-Cookie:
              description: Overwrites all three auth cookies with MaxAge=-1 to delete them.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Logged out successfully
        '403':
          description: CSRF verification missing or failed (`CSRF_TOKEN_MISSING`, `CSRF_HEADER_MISSING`, `CSRF_TOKEN_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout-all:
    post:
      summary: Logout All Devices
      description: |
        Revokes every active session for the authenticated user (all devices), e.g. after a
        suspected account compromise, then clears the current browser's auth cookies. Requires
        an authenticated access token and CSRF verification.
      security:
        - CookieAuth: []
        - CSRFToken: []
      responses:
        '200':
          description: All sessions revoked. Clears the current browser's `access_token`, `refresh_token`, and `csrf_token` cookies.
          headers:
            Set-Cookie:
              description: Overwrites all three auth cookies with MaxAge=-1 to delete them.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Logged out of all devices
        '401':
          description: Access token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF verification missing or failed (`CSRF_TOKEN_MISSING`, `CSRF_HEADER_MISSING`, `CSRF_TOKEN_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to revoke sessions (`INTERNAL_SERVER_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Get Current User Profile
      description: Returns the authenticated user's full profile, including stats and associated events (attended events for buyers, organized events for organizers/admins).
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Authenticated user no longer exists (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load profile stats or associated events (`INTERNAL_SERVER_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Current User Profile
      description: Updates the authenticated user's editable profile fields.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Profile updated successfully
        '400':
          description: Invalid JSON body or payload over 1MB (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF verification missing or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Validation failed (`VALIDATION_FAILED`): full_name required and â‰¤255 chars, phone_number â‰¤50, location â‰¤255, bio â‰¤2000.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database update failed (`INTERNAL_SERVER_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/forgot-password:
    post:
      summary: Request Password Reset
      description: |
        Sends a password-reset email if the address is registered. Always returns the same generic
        message regardless of whether the email exists, so the response cannot be used to enumerate
        accounts. If the caller's origin cannot be resolved against `FRONTEND_URL` /
        `ALLOWED_FRONTEND_ORIGINS`, no email is sent but the same 200 is still returned.

        Rate limited per client IP (3 per 15 minutes) AND per target email (5 per hour) - the
        email-keyed limit catches a distributed mail-bomb aimed at one address that an IP-keyed
        limit alone would never see as a pattern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Always returned when the request body is well-formed, regardless of whether the email is registered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Jika email terdaftar, instruksi reset password telah dikirim ke email Anda.
        '400':
          description: Email is required (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 3 requests from this IP within 15 minutes, or more than 5 requests for this email within 1 hour (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/reset-password:
    post:
      summary: Reset Password
      description: |
        Consumes a password-reset token (mailed by `POST /api/v1/auth/forgot-password`) to set a
        new password.

        Rate limited per client IP: at most 10 attempts per 15-minute window - bounds token
        brute-forcing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, new_password]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                new_password:
                  type: string
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Password berhasil direset. Silakan login dengan password baru Anda.
        '400':
          description: |
            Missing token/email/new_password (`BAD_REQUEST`), or the token is invalid, expired, or
            does not match the given email (`RESET_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 10 attempts from this IP within 15 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/send-otp:
    post:
      summary: Send Email OTP
      description: |
        Emails a one-time verification code for the given purpose (defaults to `"verifikasi"` when
        omitted).

        Rate limited per client IP (5 per 15 minutes) AND per target email (5 per hour), same
        IP+email double-keying rationale as `forgot-password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  type: string
                  example: verifikasi
      responses:
        '200':
          description: OTP sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Kode OTP telah dikirim ke email Anda.
                          otp:
                            type: string
                            description: The OTP code itself, echoed back in the response body.
        '400':
          description: Email is required (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 5 requests from this IP within 15 minutes, or more than 5 requests for this email within 1 hour (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to send the OTP email (`INTERNAL_SERVER_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events:
    get:
      summary: List Events (Public Discovery)
      description: |
        Retrieves a paginated list of events. Authentication is optional and does not change the result set.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Rounded up to the nearest multiple of 10 and capped at 100 (e.g. 7â†’10, 101â†’100). Defaults to 20 when absent or non-integer.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Row offset. Floored to the nearest multiple of 10 (e.g. 15â†’10); negative values clamp to 0. Defaults to 0.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventListResponse'
        '500':
          description: Database/Internal error (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Event
      description: |
        Creates a new event from a multipart form. Requires the Event Organizer platform role
        (Super Admin bypasses the check and may additionally set `organizer_id` in `event_data`
        to create on behalf of another organizer; for non-admins `organizer_id` is always forced
        to the caller's own ID).

        Total request body is limited to 10MB.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - event_data
              properties:
                event_data:
                  type: string
                  description: JSON-encoded string matching the CreateEventRequest schema.
                  example: '{"venue_id":1,"title":"Symphony Orchestra Concert","description":"An evening of classical symphonies.","starts_at":"2026-10-15T19:30:00Z","ends_at":"2026-10-15T22:00:00Z","entertainment_tax_rate":0.1,"entertainment_tax_passed_to_buyer":true,"event_type_id":1}'
                cover_image:
                  type: string
                  format: binary
                  description: Optional cover image. Validated by MIME signature sniffing; max 10MB.
      responses:
        '201':
          description: Event created successfully (status starts as `draft`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventDetailResponse'
        '400':
          description: Malformed multipart form, missing/invalid `event_data`, or cover image failed validation (`BAD_REQUEST`, `INVALID_FILE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token is missing or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Event Organizer required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation of event properties failed (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Cover image upload to object storage failed (`UPLOAD_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}:
    get:
      summary: Get Event Details
      description: |
        Retrieves detailed parameters of a specific event. Authentication is optional; events that are
        not yet `approved` are only visible to their organizer or a Super Admin - all other callers
        receive a 404 (not a 403, to prevent draft-event ID enumeration).
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      responses:
        '200':
          description: Event details retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventDetailResponse'
        '400':
          description: Event ID missing or not an integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found, or not approved and caller is not its organizer/Super Admin (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Event
      description: Updates an event's core details. Requires an event-scoped Event Organizer role for this specific event (Super Admin bypasses the check). Rejected while the event is locked (pending review).
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                venue_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                entertainment_tax_rate:
                  type: number
                entertainment_tax_passed_to_buyer:
                  type: boolean
                event_type_id:
                  type: integer
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Event updated
        '400':
          description: Event ID must be a valid integer, or invalid request body (`INVALID_ID`, `BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication missing (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Event role authorization failed (user is not an Event Organizer of this event) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Event details cannot be changed while the event is pending review (`EVENT_LOCKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/layout:
    put:
      summary: Bind (or Unbind) Event Layout
      description: |
        Binds the event to a venue layout, or unbinds it when `layout_id` is null. The layout must
        belong to the event's own venue. Requires an event-scoped Event Organizer role for this
        specific event (Super Admin bypasses the check).
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                layout_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Event layout updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Event layout updated
                          event_id:
                            type: integer
                            example: 5
                          layout_id:
                            type: integer
                            nullable: true
                            example: 12
        '400':
          description: Event ID must be a valid integer, or invalid request body (`INVALID_ID`, `BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication missing (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Event role authorization failed (user is not an Event Organizer of this event) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            The layout does not belong to this event's venue (`LAYOUT_VENUE_MISMATCH`), or another
            validation failure (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/publish:
    patch:
      summary: Publish Event
      description: Publishes an event. Requires an event-scoped Event Organizer role for this specific event (Super Admin bypasses the check).
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      responses:
        '200':
          description: Event published successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Event published successfully
                          event_id:
                            type: integer
                            example: 5
        '400':
          description: Event ID path parameter missing or malformed (`INVALID_ID`, `BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication missing (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Event role authorization failed (user is not an Event Organizer of this event) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Publication execution failed (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/ticket-tiers:
    get:
      summary: List Ticket Tiers (Public)
      description: Returns the buyer-facing ticket tiers currently on sale for an event (public visibility, within the sales window). No authentication required.
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      responses:
        '200':
          description: Ticket tiers retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TicketTier'
        '400':
          description: Event ID must be a valid integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load ticket tiers (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/seatmap:
    get:
      summary: Get Event Seat Map
      description: >-
        Returns the live seat map for an event: the bound venue layout's
        decorative geometry, priced sections with per-seat availability and
        coordinates, and any tiers sold as general admission. Carries layout
        geometry so buyers can render the map the organizer designed without
        the organizer-gated layout endpoints. No authentication required.
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      responses:
        '200':
          description: Seat map retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SeatMap'
        '400':
          description: Event ID must be a valid integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load seat map (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/booking/holds:
    post:
      summary: Create Booking Hold
      description: |
        Places a temporary hold on either specific seats (assigned seating) or a quantity of
        general-admission tickets for a single ticket tier - never both in one request. The hold
        is all-or-nothing: if any requested seat is already held/sold, nothing is held.

        Requires the buyer ("User") platform role - reserving inventory could lock seats out of
        sale without ever completing an order, so this is gated the same as `POST /api/v1/orders`.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '201':
          description: Hold acquired.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Hold'
        '400':
          description: Invalid JSON request body (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            CSRF verification missing or failed (`CSRF_TOKEN_MISSING`, `CSRF_HEADER_MISSING`,
            `CSRF_TOKEN_MISMATCH`), or the account does not hold the buyer role
            (`BUYER_ROLE_REQUIRED`) - organizer, auditor and staff accounts cannot purchase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Request rejected (`INVALID_REQUEST`: both seats and a quantity sent, or neither a
            ticket type/quantity given; `SEATS_NOT_FOUND`: one or more seat IDs are not part of
            this event; `SEATS_REQUIRED`: the tier has assigned seating and cannot be held by
            quantity; `PER_ORDER_LIMIT`: the event's max-tickets-per-order cap would be exceeded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Hold could not be acquired (`SALES_CLOSED`: the tier is not currently bookable;
            `SEATS_TAKEN`: one of the requested seats was just held/sold by someone else;
            `NOT_ENOUGH_TICKETS`: insufficient remaining GA capacity for the requested quantity).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to acquire the hold (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/booking/holds/{token}:
    get:
      summary: Get Booking Hold
      description: |
        Rebuilds the buyer's cart (tiers/seats and prices, read fresh from the database) from a
        hold token, e.g. when the checkout page is reloaded.
      security:
        - CookieAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: The hold token returned when the hold was created.
          schema:
            type: string
      responses:
        '200':
          description: Hold details retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Hold'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The hold has expired or never existed (`HOLD_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Release Booking Hold
      description: Releases a previously acquired hold using only its token.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: token
          in: path
          required: true
          description: The hold token returned when the hold was created.
          schema:
            type: string
      responses:
        '200':
          description: Hold released.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Hold released
        '400':
          description: Hold token missing (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF verification missing or failed (`CSRF_TOKEN_MISSING`, `CSRF_HEADER_MISSING`, `CSRF_TOKEN_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Hold not found or already expired (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders:
    post:
      summary: Create Order (Midtrans Transaction)
      description: |
        Creates an order for a previously-acquired hold and starts a Midtrans Snap transaction.
        Pricing is re-derived server-side from the hold token - `cart_items` on the request is
        display data only and is never used to compute money.

        Requires the buyer ("User") platform role, the same gate as `POST /api/v1/booking/holds`.

        Rate limited per client IP: at most 20 attempts per 5-minute window (fixed-window counter
        in Redis; fails open on Redis outage) - generous on purpose, since a popular tier selling
        out mid-checkout causes legitimate resubmits.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Midtrans transaction created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: |
            Invalid JSON body (`INVALID_INPUT`), or attendee capture failed validation
            (`INVALID_ATTENDEES`) - e.g. a missing attendee for a held seat, or a malformed NIK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            CSRF verification missing or failed (`CSRF_TOKEN_MISSING`, `CSRF_HEADER_MISSING`,
            `CSRF_TOKEN_MISMATCH`), or the account does not hold the buyer role
            (`BUYER_ROLE_REQUIRED`) - organizer, auditor and staff accounts cannot purchase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 20 order attempts from this IP within 5 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to process the payment transaction (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/payment/webhook:
    post:
      summary: Midtrans Payment Webhook
      description: |
        Receives asynchronous payment status notifications from Midtrans and, on a paid
        transaction, mints tickets and emails the buyer's e-ticket link. Public - Midtrans must
        be able to reach it unauthenticated - and authenticity instead comes from verifying the
        payload's Midtrans signature.

        Deliberately NOT rate limited: Midtrans retries from a small, well-known set of IPs, and
        throttling this endpoint would mean a paid order could silently never get marked paid.
      responses:
        '200':
          description: Webhook processed (or accepted as a no-op for a status this order doesn't act on).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
        '400':
          description: Invalid JSON payload (`INVALID_INPUT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Midtrans signature verification failed - the payload did not come from Midtrans, or the wrong server key is configured (`INVALID_SIGNATURE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to process the webhook (`WEBHOOK_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/my-tickets:
    get:
      summary: List My Tickets
      description: Lists every ticket the authenticated user has purchased.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Tickets retrieved (possibly empty).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tickets:
                            type: array
                            items:
                              $ref: '#/components/schemas/Ticket'
                          count:
                            type: integer
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load tickets (`SERVER_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/complete-payment:
    post:
      summary: Complete Payment (Manual Finalize)
      description: Finalizes a paid order, minting tickets, without waiting for the Midtrans webhook.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
      responses:
        '200':
          description: Payment completed and tickets issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId:
                            type: string
                          status:
                            type: string
                          ticketsCount:
                            type: integer
                          message:
                            type: string
        '400':
          description: Missing `orderId` (`BAD_REQUEST`), or the order could not be completed (`PAYMENT_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/order-access/{orderId}:
    get:
      summary: Get Order Access (Link-as-Credential)
      description: |
        Returns the buyer-facing order/ticket summary for the e-ticket link
        `{FRONTEND_URL}/booking/<order_uuid>`. Deliberately unauthenticated: the order UUID in the
        path IS the access control (plan decision 4) - UUID entropy makes brute force impractical.

        Rate limited per client IP: at most 60 requests per 5-minute window (fixed-window counter
        in Redis; fails open on Redis outage).
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order access summary retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderAccessResponse'
        '400':
          description: Order ID is required (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No order with that ID (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 60 requests from this IP within 5 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/order-access/{orderId}/tickets/{ticketId}:
    get:
      summary: Get Ticket Access By Order (Link-as-Credential)
      description: |
        Returns one ticket's secret-bearing access payload (`secretKey`, the rotating QR
        material) for the e-ticket link `{FRONTEND_URL}/booking/<order_uuid>/t/<ticket_uuid>`.
        Both the order id and ticket id must match together - unauthenticated, same link-as-credential
        model as `GET /api/v1/order-access/{orderId}`. Every successful fetch is recorded
        fire-and-forget (SHA-256 hashes of client IP/User-Agent only, never the raw values) for
        M5 booking-access telemetry.

        Rate limited per client IP: at most 60 requests per 5-minute window (fixed-window counter
        in Redis; fails open on Redis outage).
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket access payload retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TicketAccessResponse'
        '400':
          description: Order ID and Ticket ID are required (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No matching order/ticket pair (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 60 requests from this IP within 5 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/order-access/{orderId}/tickets/{ticketId}/rotate:
    post:
      summary: Rotate Ticket Access Secret (Panic Revoke / Transfer)
      description: |
        Rotates a ticket's secret key, invalidating any previously issued QR/link material for it.
        Same link-as-credential scoping as the GET routes above - unauthenticated, order id and
        ticket id must match together - but a rarer, more sensitive write, so it sits behind its
        own tighter limiter rather than the read routes' ceiling.

        Rate limited per client IP: at most 10 requests per 15-minute window (fixed-window counter
        in Redis; fails open on Redis outage).
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Secret rotated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ticketId:
                            type: string
                          rotated:
                            type: boolean
                            example: true
        '400':
          description: Order ID and Ticket ID are required (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No matching order/ticket pair (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 10 requests from this IP within 15 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/venues:
    get:
      summary: List Venues
      description: Lists all venues. Requires the Event Organizer platform role (Super Admin bypasses the check).
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Venues retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VenueResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed - Event Organizer required (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database/Internal error (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/event-types:

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived JWT access token. Sent on every request (Path `/`).
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Long-lived, rotating, server-revocable refresh token. Scoped to Path
        `/api/v1/auth`, so it is only sent to `/api/v1/auth/refresh` (to rotate)
        and `/api/v1/auth/logout` (to revoke). Used by `POST /api/v1/auth/refresh`
        to mint a new access token when the access token has expired.
    StateCookie:
      type: apiKey
      in: cookie
      name: oauth_state
      description: Google oauth flow verification token.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-Submit CSRF Token header. Must match values in the `csrf_token` cookie.
    TicketmanCookieAuth:
      type: apiKey
      in: cookie
      name: ticketman_access_token
      description: |
        Session cookie for ticketman (event scanner staff) accounts - an entirely separate JWT
        session system from the platform CookieAuth above, signed with its own secret
        (`TICKETMAN_JWT_SECRET`) and never accepted by ordinary user routes, or vice versa.

  schemas:
    StandardResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Set to true if request completed successfully.
          example: true

    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable short error classification code.
          example: FORBIDDEN
        message:
          type: string
          description: Human-readable error description context.
          example: You do not have permission to access this resource
        details:
          type: object
          description: Optional key-value structured details about validation failures.

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/APIError'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: richie@crowdflow.com
        password:
          type: string
          format: password
          example: password123
        full_name:
          type: string
          example: Richie Obhasa

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@crowdflow.com
        password:
          type: string
          format: password
          example: admin123

    UpdateProfileRequest:
      type: object
      required:
        - full_name
      properties:
        full_name:
          type: string
          maxLength: 255
          example: Richie Obhasa
        phone_number:
          type: string
          maxLength: 50
          example: "+62 812 3456 7890"
        location:
          type: string
          maxLength: 255
          example: Jakarta, Indonesia
        bio:
          type: string
          maxLength: 2000
          example: Live music enthusiast.

    ProfileStats:
      type: object
      properties:
        total_tickets:
          type: integer
          example: 4
        events_attended:
          type: integer
          example: 2
        saved_events:
          type: integer
          description: Stubbed to 0 for future development.
          example: 0
        total_orders:
          type: integer
          example: 3


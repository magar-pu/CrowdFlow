  /api/v1/venues/{id}/layouts/{lid}:
    put:
      summary: Save Venue Layout
      description: |
        Persists the whole editor state (geometry, sections and seats) in one transaction.
        Sections and seats diff against what is stored: an element with a non-null `id` is
        updated, a null `id` is inserted, and a stored row absent from the payload is deleted
        (subject to in-use guards). Uses optimistic locking via `expected_updated_at`.
        Requires the Event Organizer or Super Admin platform role, and the caller must own the layout.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the venue.
          schema:
            type: integer
        - name: lid
          in: path
          required: true
          description: The numeric database ID of the layout being saved.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLayoutRequest'
      responses:
        '200':
          description: Layout saved. Returns the persisted layout plus the temp-id to real-id maps.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SaveLayoutResponse'
        '400':
          description: Venue/layout ID not an integer (`INVALID_ID`), malformed JSON body (`BAD_REQUEST`), or invalid layout payload (`INVALID_INPUT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed - Event Organizer or Super Admin required - CSRF mismatch, or the caller does not own the layout (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Layout not found (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The layout changed since it was loaded (`STALE_LAYOUT`), or a removed seat is already in use for an event (`SEAT_IN_USE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database/Internal error (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


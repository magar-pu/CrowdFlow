services:
  frontend:
    build: ./frontend
    container_name: crowdflow-frontend
    ports:
      - "3000:3000"
    restart: always
    networks:
      - crowdflow-net
    environment:
      - NODE_ENV=production

  backend:
    build: ./backend
    container_name: crowdflow-backend
    ports:
      - "8080:8080"
    restart: always
    networks:
      - crowdflow-net
    env_file:
      - ./backend/.env
    environment:
      - DB_DSN=postgres://postgres:postgres@host.docker.internal:5432/crowdflow?sslmode=disable
      - GOOGLE_CLIENT_ID=91716845059-1l96nahbcu7nb39k1sa9r4ev8p2nitdu.apps.googleusercontent.com
      - DEV_MODE=true
      - S3_ENDPOINT=http://minio:9000

  nginx:
    image: nginx:alpine
    pull_policy: never
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    container_name: crowdflow-nginx
    ports:
      - "80:80"
    restart: always
    depends_on:
      - frontend
      - backend
    networks:
      - crowdflow-net


services:
  frontend:
    build: 
      context: ./frontend
      args:
        - BACKEND_URL=http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: always
    networks:
      - crowdflow-net
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: always
    networks:
      - crowdflow-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    environment:
      - DEV_MODE=true
      - REDIS_ADDR=redis:6379
      # No DB_DSN here on purpose. It belongs to backend/.env, and an entry in
      # this block would silently win over it — compose `environment:` overrides
      # `env_file:`. A leftover override pointing at the removed `postgres`
      # service is what put the backend in a crash loop
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - crowdflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  nginx:
    image: nginx:alpine
    pull_policy: never
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:${NGINX_PORT:-8000}:80"
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - crowdflow-net

networks:
  crowdflow-net:
    driver: bridge

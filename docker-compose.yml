services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: always
    networks:
      - crowdflow-net
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: always
    networks:
      - crowdflow-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    environment:
      - GOOGLE_CLIENT_ID=91716845059-1l96nahbcu7nb39k1sa9r4ev8p2nitdu.apps.googleusercontent.com
      - DEV_MODE=false
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - crowdflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    pull_policy: never
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${NGINX_PORT:-8000}:80"
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - crowdflow-net

  minio:
    image: minio/minio:latest
    container_name: crowdflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminpassword
    command: server /data --console-address ":9001"
    networks:
      - crowdflow-net

  minio-init:
    image: minio/mc:latest
    container_name: crowdflow-minio-init
    depends_on:
      - minio
    networks:
      - crowdflow-net
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadminpassword; do echo 'Waiting for MinIO...'; sleep 1; done;
      if ! /usr/bin/mc ls localminio/crowdflow-public > /dev/null 2>&1; then
        /usr/bin/mc mb localminio/crowdflow-public;
        /usr/bin/mc anonymous set public localminio/crowdflow-public;
        echo 'Bucket crowdflow-public created successfully';
      else
        echo 'Bucket crowdflow-public already exists';
      fi;
      if ! /usr/bin/mc ls localminio/crowdflow-private > /dev/null 2>&1; then
        /usr/bin/mc mb localminio/crowdflow-private;
        echo 'Bucket crowdflow-private created successfully';
      else
        echo 'Bucket crowdflow-private already exists';
      fi;
      "

networks:
  crowdflow-net:
    driver: bridge

volumes:
  minio-data:
    driver: local


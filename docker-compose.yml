services:
  frontend:
    image: ghcr.io/${GHCR_OWNER:-crowdflow}/crowdflow-frontend:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: always
    networks:
      - crowdflow-net
    # frontend/.env is READ ONLY by `npm run dev` (Next loads it directly,
    # bypassing Docker entirely) — it is NOT wired in here via env_file. It
    # used to be irrelevant to this service because the three NEXT_PUBLIC_*
    # values were build args; now that they're read at container start (see
    # docker-entrypoint.sh below) it would be a real hazard: a host can
    # perfectly well have real values in frontend/.env for local dev while
    # the root .env this file interpolates from has none, and if
    # `env_file: ./frontend/.env` were listed here, compose's `environment:`
    # (below) would win over it — so a bare `${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}`
    # (empty on such a host) would SHADOW the real key from frontend/.env with
    # an empty string, silently, exactly the trap the backend service's
    # comment below warns about. Keeping frontend/.env out of this service
    # entirely (not just out of `environment:`) is what makes that
    # impossible rather than merely unlikely.
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
      # NEXT_PUBLIC_* now arrive at container START, not image build — see
      # frontend/docker-entrypoint.sh and src/lib/runtimeEnv.ts. One frontend
      # image (ghcr.io/.../crowdflow-frontend) now serves every environment;
      # only these three lines differ between prod and sandbox stacks. They
      # must be set in the ROOT .env (see .env.example) for a containerised
      # deploy — frontend/.env is not consulted here at all, see above.
      - NEXT_PUBLIC_APP_ENV=${APP_ENV:-local}
      - NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: always
    networks:
      - crowdflow-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_ADDR=redis:6379
      # No DB_DSN here on purpose. It belongs to backend/.env, and an entry in
      # this block would silently win over it — compose `environment:` overrides
      # `env_file:`. A leftover override pointing at the removed `postgres`
      # service is what put the backend in a crash loop
      #
      # No APP_ENV here either, for exactly the same reason, and it is worth
      # spelling out because this file already made that mistake: it used to
      # pin `DEV_MODE=true` right here. deploy-main.sh and deploy-dev.sh share
      # this one compose file, so that single line silently put PRODUCTION into
      # development mode — relaxed Secure-cookie flag, no required JWT_SECRET —
      # and no amount of editing backend/.env on the prod host could override
      # it. APP_ENV is per-host and belongs in backend/.env alone.
      #
      # Same rule for FRONTEND_URL (e-ticket email links — see backend/main.go
      # and backend/.env.example): it differs per host exactly like APP_ENV
      # does, so it lives in backend/.env, loaded above via env_file. Every
      # host's backend/.env needs FRONTEND_URL set (backend/main.go refuses to
      # boot without it unless APP_ENV=local) — for this docker-compose stack
      # that means plain http://localhost (no port), matching NGINX_PORT=80 in
      # the root .env: local OAuth also requires the origin to be exactly
      # http://localhost, not :3000 or :8080, so this is not just cosmetic.
      # If NGINX_PORT is changed from 80 on a given host, FRONTEND_URL must be
      # updated to match.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    # Redis is not a cache here — it holds every refresh-token session
    # (internal/auth/session.go). Without persistence, recreating this
    # container logs out every user on every device, which is what used to
    # happen on any `docker compose down` or image bump. AOF gives per-second
    # durability; `command:` overrides the image CMD, which is a bare
    # `redis-server`, so nothing else is lost.
    #
    # Two things this does NOT protect against, both worth knowing:
    #   * a manual FLUSHDB still wipes every session — that command is not a
    #     debugging convenience here, it is a mass logout.
    #   * the FIRST `up -d` after this change recreates the container and so
    #     ends all existing sessions once. One time, and the last time.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - crowdflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  nginx:
    image: nginx:alpine
    pull_policy: never
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${NGINX_PORT:-8000}:80"
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - crowdflow-net

networks:
  crowdflow-net:
    driver: bridge

# Named volume for the Redis AOF. Survives `down`/`up` and image bumps; removed
# only by an explicit `docker compose down -v`, which IS a mass logout.
volumes:
  redis-data:

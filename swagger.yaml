        - name: offset
          in: query
          required: false
          description: Row offset. Defaults to 0; negative values are ignored.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Payouts retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:

openapi: 3.0.3
info:
  title: CrowdFlow Event Ticketing API
  description: |
    API documentation for the CrowdFlow Venue and Event Management platform.

    ### Security Architecture:
    - **Session Authentication**: JWT access token set as a secure `HttpOnly` cookie named `access_token`.
    - **CSRF Protection**: State-changing endpoints require Double-Submit Cookie verification. The client extracts the value of the `csrf_token` cookie and submits it in the custom header `X-CSRF-Token`. Only `/api/v1/auth/login` and `/api/v1/auth/register` are exempt.
    - **Admin Console**: Every `/api/v1/admin/*` route requires the `Super Admin` platform role.

    All responses (success and error) are wrapped in a standard JSON response envelope.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development Server
  - url: /
    description: Proxy Gateway (Nginx)

paths:
  /api/health:
    get:
      summary: Health Check
      description: Verifies database connectivity and application status.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          message:
                            type: string
                            example: CrowdFlow API is running
        '500':
          description: Database or server connectivity error (`DATABASE_UNREACHABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: User Registration
      description: Registers a new user native credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: User registered successfully
        '400':
          description: Invalid request body (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed - missing required fields (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - email already exists (`EMAIL_ALREADY_REGISTERED`) or other registration failure (`REGISTRATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: User Login
      description: |
        Native credentials login. Generates access session cookies.

        Rate limited per client IP: at most 10 attempts per 15-minute window
        (fixed-window counter in Redis; fails open on Redis outage).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication. Sets `access_token` and `csrf_token` cookies.
          headers:
            Set-Cookie:
              description: |
                Sets two cookies:
                1. `access_token`: Secure HttpOnly JWT session token.
                2. `csrf_token`: Client-readable cookie for CSRF double-submission.
              schema:
                type: string
                example: access_token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            type: string
                            example: "12"
                          email:
                            type: string
                            format: email
                            example: admin@crowdflow.com
                          full_name:
                            type: string
                            example: Richie Obhasa
                          role:
                            type: string
                            description: Highest-privilege platform-wide role held by the user.
                            enum: [User, Event Organizer, Super Admin]
                            example: Super Admin
        '400':
          description: Invalid JSON body (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid credentials (`AUTHENTICATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - more than 10 login attempts from this IP within 15 minutes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/google/login:
    get:
      summary: Google OAuth Redirect
      description: Initiates Google OAuth2 authorization code flow by redirecting the browser.
      responses:
        '307':
          description: Temporary redirect to Google's consent screen. Sets `oauth_state` cookie (5 minute expiry).
          headers:
            Location:
              description: Google Authorization URL.
              schema:
                type: string
                example: https://accounts.google.com/o/oauth2/v2/auth?...
            Set-Cookie:
              description: Sets `oauth_state` HttpOnly cookie for CSRF state validation.
              schema:
                type: string

  /api/v1/auth/google/callback:
    get:
      summary: Google OAuth Callback
      description: Processes Google authorization code, verifies state, provisions user, and redirects the browser based on the user's platform role.
      parameters:
        - name: state
          in: query
          required: true
          description: OAuth state verification token matching the `oauth_state` cookie.
          schema:
            type: string
        - name: code
          in: query
          required: true
          description: Authorization code returned from Google.
          schema:
            type: string
      security:
        - StateCookie: []
      responses:
        '307':
          description: |
            Redirect outcome. On successful login the `oauth_state` cookie is cleared, `access_token` and
            `csrf_token` session cookies are set, and the browser is redirected by platform role:
            - `Event Organizer` → `/dashboard`
            - `Super Admin` → `/admin`
            - everyone else → `/`

            If the email is already registered with native credentials, no session is created and the browser
            is redirected to `/login?error=PROVIDER_MISMATCH&provider=native`.
          headers:
            Location:
              schema:
                type: string
                example: /dashboard
        '400':
          description: State verification cookie missing or auth code missing (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: State token verification mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication code exchange failed (`AUTHENTICATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User Logout
      description: Clears active user session cookies. Does not require an authenticated session, but does require CSRF verification (double-submit cookie).
      security:
        - CSRFToken: []
      responses:
        '200':
          description: Successfully logged out. Clears `access_token` and `csrf_token` cookies.
          headers:
            Set-Cookie:
              description: Overwrites active cookies with MaxAge=-1 to delete them.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Logged out successfully
        '403':
          description: CSRF verification missing or failed (`CSRF_TOKEN_MISSING`, `CSRF_HEADER_MISSING`, `CSRF_TOKEN_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Get Current User Profile
      description: Returns the authenticated user's full profile, including stats and associated events (attended events for buyers, organized events for organizers/admins).
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Authenticated user no longer exists (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load profile stats or associated events (`INTERNAL_SERVER_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Current User Profile
      description: Updates the authenticated user's editable profile fields.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Profile updated successfully
        '400':
          description: Invalid JSON body or payload over 1MB (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF verification missing or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Validation failed (`VALIDATION_FAILED`): full_name required and ≤255 chars, phone_number ≤50, location ≤255, bio ≤2000.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database update failed (`INTERNAL_SERVER_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events:
    get:
      summary: List Events (Public Discovery)
      description: |
        Retrieves a paginated list of events. Authentication is optional and does not change the result set.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Rounded up to the nearest multiple of 10 and capped at 100 (e.g. 7→10, 101→100). Defaults to 20 when absent or non-integer.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Row offset. Floored to the nearest multiple of 10 (e.g. 15→10); negative values clamp to 0. Defaults to 0.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventListResponse'
        '500':
          description: Database/Internal error (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Event
      description: |
        Creates a new event from a multipart form. Requires the Event Organizer platform role
        (Super Admin bypasses the check and may additionally set `organizer_id` in `event_data`
        to create on behalf of another organizer; for non-admins `organizer_id` is always forced
        to the caller's own ID).

        Total request body is limited to 10MB.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - event_data
              properties:
                event_data:
                  type: string
                  description: JSON-encoded string matching the CreateEventRequest schema.
                  example: '{"venue_id":1,"title":"Symphony Orchestra Concert","description":"An evening of classical symphonies.","starts_at":"2026-10-15T19:30:00Z","ends_at":"2026-10-15T22:00:00Z","entertainment_tax_rate":0.1,"entertainment_tax_passed_to_buyer":true,"event_type_id":1}'
                cover_image:
                  type: string
                  format: binary
                  description: Optional cover image. Validated by MIME signature sniffing; max 10MB.
      responses:
        '201':
          description: Event created successfully (status starts as `draft`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventDetailResponse'
        '400':
          description: Malformed multipart form, missing/invalid `event_data`, or cover image failed validation (`BAD_REQUEST`, `INVALID_FILE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token is missing or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Event Organizer required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation of event properties failed (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Cover image upload to object storage failed (`UPLOAD_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}:
    get:
      summary: Get Event Details
      description: |
        Retrieves detailed parameters of a specific event. Authentication is optional; events that are
        not yet `approved` are only visible to their organizer or a Super Admin - all other callers
        receive a 404 (not a 403, to prevent draft-event ID enumeration).
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      responses:
        '200':
          description: Event details retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventDetailResponse'
        '400':
          description: Event ID missing or not an integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found, or not approved and caller is not its organizer/Super Admin (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/publish:
    patch:
      summary: Publish Event
      description: Publishes an event. Requires an event-scoped Event Organizer role for this specific event (Super Admin bypasses the check).
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      responses:
        '200':
          description: Event published successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Event published successfully
                          event_id:
                            type: integer
                            example: 5
        '400':
          description: Event ID path parameter missing or malformed (`INVALID_ID`, `BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication missing (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Event role authorization failed (user is not an Event Organizer of this event) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Publication execution failed (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/ticket-tiers:
    get:
      summary: List Ticket Tiers (Public)
      description: Returns the buyer-facing ticket tiers currently on sale for an event (public visibility, within the sales window). No authentication required.
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      responses:
        '200':
          description: Ticket tiers retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TicketTier'
        '400':
          description: Event ID must be a valid integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load ticket tiers (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/seatmap:
    get:
      summary: Get Event Seat Map
      description: Returns the live seat map for an event, grouped by section with per-seat availability state. No authentication required.
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the event.
          schema:
            type: integer
      responses:
        '200':
          description: Seat map retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SeatSection'
        '400':
          description: Event ID must be a valid integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load seat map (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/booking/holds:
    post:
      summary: Create Booking Hold
      description: |
        Places a temporary hold on either specific seats (assigned seating) or a quantity of
        general-admission tickets for a single ticket tier - never both in one request. The hold
        is all-or-nothing: if any requested seat is already held/sold, nothing is held.
      security:
        - CookieAuth: []
        - CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '201':
          description: Hold acquired.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Hold'
        '400':
          description: Invalid JSON request body (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF verification missing or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Hold could not be acquired - seats already held/sold or insufficient GA capacity (`HOLD_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/booking/holds/{token}:
    delete:
      summary: Release Booking Hold
      description: Releases a previously acquired hold using only its token.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: token
          in: path
          required: true
          description: The hold token returned when the hold was created.
          schema:
            type: string
      responses:
        '200':
          description: Hold released.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Hold released
        '400':
          description: Hold token missing (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF verification missing or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Hold not found or already expired (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/venues:
    get:
      summary: List Venues
      description: Lists all venues. Requires the Event Organizer platform role (Super Admin bypasses the check).
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Venues retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VenueResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed - Event Organizer required (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database/Internal error (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/event-types:
    get:
      summary: List Event Types
      description: Lists all event type categories. Requires the Event Organizer platform role (Super Admin bypasses the check).
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Event types retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventTypeResponse'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed - Event Organizer required (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database/Internal error (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/dashboard/stats:
    get:
      summary: Admin - Dashboard Statistics
      description: Returns platform-wide aggregate stats. Requires the Super Admin platform role.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Stats retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed - Super Admin required (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load dashboard statistics (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/dashboard/alerts:
    get:
      summary: Admin - Security Alerts
      description: |
        Returns security alerts. Requires the Super Admin platform role.
        **Placeholder**: no backing table exists yet - always returns an empty array.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Alerts retrieved (currently always an empty list).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object

        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the target user.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRoleRequest'
      responses:
        '201':
          description: Role granted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Role granted
        '400':
          description: User ID not an integer or invalid JSON body (`INVALID_ID`, `BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid, or the authenticated admin could not be resolved (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Grant failed - user not found, user not verified, or user already has this role assignment (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/verifications:
    get:
      summary: Admin - List Verification Applications
      description: |
        Returns the verification queue, derived directly from users with
        `verification_status = 'pending_verification'` (there is no separate applications table -
        the application `id` is the user's own ID). `businessType`/`documentType` are placeholder
        fields until a real KYC application table exists. Ordered oldest first.
        Requires the Super Admin platform role.
      security:
        - CookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 when absent or not a positive integer.
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          description: Row offset. Defaults to 0; negative values are ignored.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Verification applications retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VerificationApplication'
        '401':
          description: Session token missing, invalid, or expired (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed - Super Admin required (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load verification applications (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/verifications/{id}/approve:
    post:
      summary: Admin - Approve Verification
      description: |
        Approves a verification application by setting the applicant's status to `Verified`. The `id`
        is the applicant user's own ID (see list endpoint). Recorded in the admin activity log.
        Requires the Super Admin platform role.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The applicant's user ID.
          schema:
            type: integer
      responses:
        '200':
          description: Verification approved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Verification approved
        '400':
          description: Applicant ID must be a valid integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid, or the authenticated admin could not be resolved (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Status update failed - e.g. user not found (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/verifications/{id}/reject:
    post:
      summary: Admin - Reject Verification
      description: |
        Rejects a verification application by setting the applicant's status to `Suspended`
        (stored as `rejected`). The `id` is the applicant user's own ID. Recorded in the admin
        activity log. Requires the Super Admin platform role.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The applicant's user ID.
          schema:
            type: integer
      responses:
        '200':
          description: Verification rejected.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Verification rejected
        '400':
          description: Applicant ID must be a valid integer (`INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid, or the authenticated admin could not be resolved (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Status update failed - e.g. user not found (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/{id}/delegations:
    get:
      summary: Admin - List User Co-Organizer Delegations
      description: |
        Read-only Super Admin oversight of a user's co-organizer delegations: those the user granted
        as an event owner (`owned`) and those delegated to the user as a co-organizer (`received`).
        Delegations are created from the organizer console, not here. Requires the Super Admin platform role.
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the target user.
          schema:
            type: integer
      responses:
        '200':
          description: The user's delegations, both directions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          owned:
                            type: array
                            items:
                              $ref: '#/components/schemas/Delegation'
                          received:
                            type: array
                            items:
                              $ref: '#/components/schemas/Delegation'
        '400':
          description: User ID not an integer (`BAD_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session token missing/invalid (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/delegations/{id}:
    delete:
      summary: Admin - Revoke Co-Organizer Delegation
      description: |
        Moderation revoke of any co-organizer delegation, regardless of ownership. Sets the delegation
        status to `revoked` and notifies both the owner and the delegate. Requires the Super Admin platform role.
      security:
        - CookieAuth: []
        - CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric database ID of the delegation.
          schema:
            type: integer
      responses:
        '200':
          description: Delegation revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked:
                            type: boolean
                            example: true
        '401':
          description: Session token missing/invalid (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Platform role check failed (Super Admin required) or CSRF mismatch (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Delegation not found (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Delegation is already declined/revoked and cannot be revoked (`INVALID_STATE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT authentication token.
    StateCookie:
      type: apiKey
      in: cookie
      name: oauth_state
      description: Google oauth flow verification token.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-Submit CSRF Token header. Must match values in the `csrf_token` cookie.

  schemas:
    StandardResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Set to true if request completed successfully.
          example: true

    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable short error classification code.
          example: FORBIDDEN
        message:
          type: string
          description: Human-readable error description context.
          example: You do not have permission to access this resource
        details:
          type: object
          description: Optional key-value structured details about validation failures.

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/APIError'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: richie@crowdflow.com
        password:
          type: string
          format: password
          example: password123
        full_name:
          type: string
          example: Richie Obhasa

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@crowdflow.com
        password:
          type: string
          format: password
          example: admin123

    UpdateProfileRequest:
      type: object
      required:
        - full_name
      properties:
        full_name:
          type: string
          maxLength: 255
          example: Richie Obhasa
        phone_number:
          type: string
          maxLength: 50
          example: "+62 812 3456 7890"
        location:
          type: string
          maxLength: 255
          example: Jakarta, Indonesia
        bio:
          type: string
          maxLength: 2000
          example: Live music enthusiast.

    ProfileStats:
      type: object
      properties:
        total_tickets:
          type: integer
          example: 4
        events_attended:
          type: integer
          example: 2
        saved_events:
          type: integer
          description: Stubbed to 0 for future development.
          example: 0
        total_orders:
          type: integer
          example: 3

    ProfileEventSummary:
      type: object
      properties:
        event_id:
          type: integer
          example: 5
        title:
          type: string
          example: Symphony Orchestra Concert
        starts_at:
          type: string
          format: date-time
          example: "2026-10-15T19:30:00Z"
        ends_at:
          type: string
          format: date-time
          example: "2026-10-15T22:00:00Z"
        cover_image_url:
          type: string
          example: https://cdn.crowdflow.example/events/covers/1720000000000000000.jpg
        status:
          type: string
          example: approved

    UserProfileResponse:
      type: object
      properties:
        user_id:
          type: string
          example: "12"
        email:
          type: string
          format: email
          example: richie@crowdflow.com
        full_name:
          type: string
          example: Richie Obhasa
        phone_number:
          type: string
          example: "+62 812 3456 7890"
        location:
          type: string
          example: Jakarta, Indonesia
        bio:
          type: string
          example: Live music enthusiast.
        avatar_url:
          type: string
          example: https://cdn.crowdflow.example/avatars/12.jpg
        role:
          type: string
          description: Highest-privilege platform-wide role held by the user.
          enum: [User, Event Organizer, Super Admin]
          example: User
        member_since:
          type: string
          description: Month and year the account was created.
          example: July 2026
        stats:
          $ref: '#/components/schemas/ProfileStats'
        events:
          type: array
          description: Attended events for buyers; organized events for organizers/admins. Empty array when none.
          items:
            $ref: '#/components/schemas/ProfileEventSummary'

    CreateEventRequest:
      type: object
      description: JSON payload carried inside the `event_data` multipart form field of POST /api/v1/events.
      required:
        - venue_id
        - title
        - starts_at
        - ends_at
        - event_type_id
      properties:
        venue_id:
          type: integer
          example: 1
        organizer_id:
          type: integer
          description: Ignored for regular organizers (forced to the caller's ID); only honored when the caller is a Super Admin.
          example: 12
        title:
          type: string
          example: Symphony Orchestra Concert
        description:
          type: string
          example: An evening featuring classical symphonies from Mozart and Beethoven.
        starts_at:
          type: string
          format: date-time
          example: "2026-10-15T19:30:00Z"
        ends_at:
          type: string
          format: date-time
          example: "2026-10-15T22:00:00Z"
        entertainment_tax_rate:
          type: number
          format: double
          example: 0.1
        entertainment_tax_passed_to_buyer:
          type: boolean
          example: true
        event_type_id:
          type: integer
          example: 1

    VenueResponse:
      type: object
      properties:
        venue_id:
          type: integer
          example: 1
        name:
          type: string
          example: Jakarta Concert Hall
        address:
          type: string
          example: Jl. Sudirman No. 1
        city:
          type: string
          example: Jakarta
        province:
          type: string
          example: DKI Jakarta
        total_capacity:
          type: integer
          example: 500

    EventTypeResponse:
      type: object
      properties:
        event_type_id:
          type: integer
          example: 1
        event_type:
          type: string
          example: Concert

    OrganizerResponse:
      type: object
      properties:
        organizer_id:
          type: integer
          example: 12
        name:
          type: string
          example: Richie Obhasa
        avatar_url:
          type: string
          example: https://cdn.crowdflow.example/avatars/12.jpg
        profile_url:
          type: string
          example: /organizers/12

    EventListResponse:
      type: object
      properties:
        event_id:
          type: integer
          example: 5
        title:
          type: string
          example: Symphony Orchestra Concert
        starts_at:
          type: string
          format: date-time
          example: "2026-10-15T19:30:00Z"
        ends_at:
          type: string
          format: date-time
          example: "2026-10-15T22:00:00Z"
        category:
          type: string
          enum: [concert, festival, sport, conference, exhibition, community, workshop_seminar, other]
          example: concert
        cover_image_url:
          type: string
          example: https://cdn.crowdflow.example/events/covers/1720000000000000000.jpg
        venue:
          $ref: '#/components/schemas/VenueResponse'
        organizer:
          $ref: '#/components/schemas/OrganizerResponse'

    EventDetailResponse:
      type: object
      properties:
        event_id:
          type: integer
          example: 5
        title:
          type: string
          example: Symphony Orchestra Concert
        description:
          type: string
          example: An evening featuring classical symphonies from Mozart and Beethoven.
        starts_at:
          type: string
          format: date-time
          example: "2026-10-15T19:30:00Z"
        ends_at:
          type: string
          format: date-time
          example: "2026-10-15T22:00:00Z"
        category:
          type: string
          enum: [concert, festival, sport, conference, exhibition, community, workshop_seminar, other]
          example: concert
        entertainment_tax_rate:
          type: number
          format: double
          example: 0.1
        entertainment_tax_passed_to_buyer:
          type: boolean
          example: true
        cover_image_url:
          type: string
          example: https://cdn.crowdflow.example/events/covers/1720000000000000000.jpg
        venue:
          $ref: '#/components/schemas/VenueResponse'
        organizer:
          $ref: '#/components/schemas/OrganizerResponse'

    TicketTier:
      type: object
      description: Buyer-facing ticket tier (booking API). Only tiers currently on sale are returned.
      properties:
        ticket_tier_id:
          type: integer
          example: 3
        event_id:
          type: integer
          example: 5
        name:
          type: string
          example: VIP
        description:
          type: string
          example: Front-row seating with lounge access.
        price:
          type: number
          format: double
          example: 750000
        quota_remaining:
          type: integer
          example: 42
        max_per_transaction:
          type: integer
          example: 4

    Seat:
      type: object
      properties:
        seat_id:
          type: integer
          example: 101
        row:
          type: string
          example: A
        number:
          type: string
          example: "12"
        status:
          type: string
          enum: [available, sold, held, blocked]
          example: available

    SeatSection:
      type: object
      properties:
        event_section_id:
          type: integer
          example: 2
        name:
          type: string
          example: Orchestra Left
        ticket_tier_id:
          type: integer
          example: 3
        price:
          type: number
          format: double
          example: 750000
        seats:
          type: array
          items:
            $ref: '#/components/schemas/Seat'

    HoldRequest:
      type: object
      description: Provide either `seat_ids` (assigned seating) or `quantity` (general admission) - never both.
      required:
        - event_id
        - ticket_tier_id
      properties:
        event_id:
          type: integer
          example: 5
        ticket_tier_id:
          type: integer
          example: 3
        seat_ids:
          type: array
          items:
            type: integer
          example: [101, 102]
        quantity:
          type: integer
          example: 2

    Hold:
      type: object
      properties:
        hold_token:
          type: string
          example: 9f2c1a7e4b8d3f6a5c0e2d1b4a7f8c3e
        expires_at:
          type: string
          format: date-time
          example: "2026-07-14T12:10:00Z"

    DashboardStats:
      type: object
      description: Admin console platform aggregates. Fields use camelCase to mirror the admin frontend types.
      properties:
        totalEvents:
          type: integer
          example: 24
        totalUsers:
          type: integer
          example: 1520
        totalRevenue:
          type: number
          format: double
          example: 152500000
        ticketsSold:
          type: integer
          example: 4310

    AdminEvent:
      type: object
      description: Admin console event row with sales aggregates. Fields use camelCase to mirror the admin frontend types.
      properties:
        id:
          type: string
          example: "5"
        name:
          type: string
          example: Symphony Orchestra Concert
        date:
          type: string
          description: Event start date (YYYY-MM-DD).
          example: "2026-10-15"
        venue:
          type: string
          example: Jakarta Concert Hall
        location:
          type: string
          example: Jakarta, DKI Jakarta
        status:
          type: string
          enum: [Active, Draft, Completed]
          example: Active
        image:
          type: string
          example: https://cdn.crowdflow.example/events/covers/1720000000000000000.jpg
        capacity:
          type: integer
          example: 500
        ticketsSold:
          type: integer
          example: 320
        totalRevenue:
          type: number
          format: double
          example: 240000000
        category:
          type: string
          example: Concert
        description:
          type: string
          example: An evening featuring classical symphonies from Mozart and Beethoven.

    AdminUser:
      type: object
      description: Admin console user row. Fields use camelCase to mirror the admin frontend types.
      properties:
        id:
          type: string
          example: "12"
        name:
          type: string
          example: Richie Obhasa
        email:
          type: string
          format: email
          example: richie@crowdflow.com
        role:
          type: string
          description: Lossy display mapping of platform roles ("Event Organizer"→Organizer, "Super Admin"→Admin, everything else→Buyer).
          enum: [Buyer, Seller, Organizer, Admin]
          example: Organizer
        status:
          type: string
          description: Display mapping of users.verification_status (verified→Verified, rejected→Suspended, pending_verification→Pending).
          enum: [Verified, Pending, Suspended]
          example: Verified
        joinedAt:
          type: string
          description: Account creation date (YYYY-MM-DD).
          example: "2026-05-02"
        transactionsCount:
          type: integer
          example: 3
        profilePic:
          type: string
          example: https://cdn.crowdflow.example/avatars/12.jpg

    Transaction:
      type: object
      description: Admin console transaction (order) row. Fields use camelCase to mirror the admin frontend types.
      properties:
        id:
          type: string
          example: "1042"
        customerName:
          type: string
          example: Richie Obhasa
        eventName:
          type: string
          example: Symphony Orchestra Concert
        amount:
          type: number
          format: double
          example: 1500000
        method:
          type: string
          description: Display mapping of the raw payment method value from the orders table.
          example: Bank Transfer
        status:
          type: string
          enum: [Success, Pending, Refunded]
          example: Success
        date:
          type: string
          description: Order creation date (YYYY-MM-DD).
          example: "2026-07-10"

    Payout:
      type: object
      description: Admin console payout row. Fields use camelCase to mirror the admin frontend types.
      properties:
        id:
          type: string
          description: Either `PENDING-<eventID>` for a synthetic live-computed outstanding balance, or a numeric payouts table row id.
          example: PENDING-7
        organizerName:
          type: string
          example: Richie Obhasa
        eventName:
          type: string
          example: Symphony Orchestra Concert
        amount:
          type: number
          format: double
          example: 12500000
        status:
          type: string
          enum: [Pending, Processed, Failed]
          example: Pending
        requestedDate:
          type: string
          description: Last paid-order activity date for synthetic rows, or requested_at for real rows (YYYY-MM-DD).
          example: "2026-07-12"

    Scanner:
      type: object
      description: Admin console scanner device row (placeholder - no backing table yet, list is always empty). Fields use camelCase to mirror the admin frontend types.
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: Gate A Scanner
        deviceName:
          type: string
          example: Zebra TC21
        status:
          type: string
          example: Online
        scansCount:
          type: integer
          example: 0
        lastSync:
          type: string
          example: ""
        batteryLevel:
          type: integer
          example: 0
        assignedSection:
          type: string
          example: ""

    VerificationApplication:
      type: object
      description: |
        Admin console verification queue row, derived from users pending verification - the `id` is
        the applicant user's own ID. businessType/documentType are placeholders until a real KYC
        application table exists. Fields use camelCase to mirror the admin frontend types.
      properties:
        id:
          type: string
          example: "18"
        name:
          type: string
          example: Richie Obhasa
        email:
          type: string
          format: email
          example: richie@crowdflow.com
        businessType:
          type: string
          example: ""
        documentType:
          type: string
          example: ""
        submittedAt:
          type: string
          description: Account creation date (YYYY-MM-DD).
          example: "2026-07-01"
        status:
          type: string
          example: Pending

    SecurityAlert:
      type: object
      description: Admin console security alert row (placeholder - no backing table yet, list is always empty). Fields use camelCase to mirror the admin frontend types.
      properties:
        id:
          type: string
          example: "1"
        title:
          type: string
          example: Multiple failed logins
        type:
          type: string
          example: auth
        description:
          type: string
          example: ""
        severity:
          type: string
          example: high
        timestamp:
          type: string
          example: ""

    Activity:
      type: object
      description: Admin console audit-trail entry (activity_log table). Fields use camelCase to mirror the admin frontend types.
      properties:
        id:
          type: string
          example: "37"
        userName:
          type: string
          description: Acting admin's full name; falls back to "Admin" when no profile exists.
          example: Richie Obhasa
        action:
          type: string
          example: Granted Role
        detail:
          type: string
          example: Granted "Jane Doe" the Event Organizer role.
        timestamp:
          type: string
          description: Formatted as YYYY-MM-DD HH:MM.
          example: "2026-07-12 14:30"

    AdminTicketTier:
      type: object
      description: Admin console ticket tier shape (camelCase, mirrors the admin frontend types). `priceCap` is not modeled in the DB yet and `color` is UI-only - both are accepted but not persisted.
      properties:
        id:
          type: string
          example: "3"
        name:
          type: string
          maxLength: 100
          example: VIP
        description:
          type: string
          example: Front-row seating with lounge access.
        price:
          type: number
          format: double
          minimum: 0
          example: 750000
        capacity:
          type: integer
          minimum: 1
          example: 100
        sold:
          type: integer
          example: 58
        priceCap:
          type: number
          format: double
          description: Not persisted - no DB column yet.
          example: 0
        color:
          type: string
          description: UI-only, not persisted.
          example: "#8b5cf6"

    VenueSection:
      type: object
      description: Admin console venue layout section (camelCase, mirrors the admin frontend types). `occupied` is not computed yet and `color` is UI-only.
      properties:
        id:
          type: string
          example: "2"
        name:
          type: string
          example: Orchestra Left
        capacity:
          type: integer
          example: 150
        occupied:
          type: integer
          description: Not computed yet - always 0.
          example: 0
        color:
          type: string
          description: UI-only, not persisted.
          example: "#22c55e"

    StatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Display-vocabulary status value; the accepted set depends on the endpoint (see each route).
          example: Verified

    GrantRoleRequest:
      type: object
      required:
        - role_id
      properties:
        role_id:
          type: integer
          description: ID from the roles table.
          example: 2
        event_id:
          type: integer
          nullable: true
          description: Omit or set null for a platform-wide grant; set to an event ID for an event-scoped grant.
          example: null

    Delegation:
      type: object
      description: |
        A co-organizer delegation: an event owner ("author") delegates management of their events to
        another verified organizer. Effective only once `status` is `active`. Co-organizers gain
        management access only, never payouts.
      properties:
        id:
          type: integer
          example: 7
        owner_id:
          type: integer
          description: The event owner (author) who granted the delegation.
          example: 12
        owner_name:
          type: string
          example: Jane Organizer
        owner_email:
          type: string
          example: jane@example.com
        delegate_id:
          type: integer
          description: The co-organizer receiving management access.
          example: 34
        delegate_name:
          type: string
          example: Sam Co-Organizer
        delegate_email:
          type: string
          example: sam@example.com
        scope:
          type: string
          enum: [all, specific]
          description: '`all` covers the owner''s whole portfolio incl. future events; `specific` covers only the listed events.'
          example: specific
        status:
          type: string
          enum: [pending, active, declined, revoked]
          example: active
        requested_by:
          type: integer
          description: The user who initiated the delegation (owner, delegate, or admin).
          example: 12
        approved_by:
          type: integer
          nullable: true
          description: The owner who approved the delegation; null until approved.
          example: 12
        note:
          type: string
          nullable: true
          example: Helping run the summer festival series.
        events:
          type: array
          description: Covered events (populated only for `scope=specific`).
          items:
            $ref: '#/components/schemas/DelegationEvent'
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    DelegationEvent:
      type: object
      properties:
        event_id:
          type: integer
          example: 42
        name:
          type: string
          example: Summer Music Festival

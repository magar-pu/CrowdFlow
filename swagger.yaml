        Returns payouts as a union of two kinds of rows. Requires the Super Admin platform role.
        1. **Synthetic pending balances** with `id` of the form `PENDING-<eventID>`: live-computed
           outstanding money owed per event (paid orders' net amount minus already-recorded payouts).
        2. **Real historical rows** from the `payouts` table (`Processed` or `Failed`), with numeric string ids.
      security:
        - CookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50 when absent or not a positive integer.
          schema:
            type: integer

    post:
      summary: Admin - Process Payout
      description: |
        Settles a payout as processed and records it in the admin activity log. Requires the Super Admin
        platform role. The `id` is either a synthetic pending balance (`PENDING-<eventID>`) or a numeric
        `payouts` row id being retried after a prior rejection.
